{% extends "base.html" %}

{% block title %}Create Bill - Billing System{% endblock %}

{% block content %}
<h1>Create New Bill</h1>

<form id="billing-form" style="max-width: 800px; margin: 20px auto;">
    <!-- Customer Email -->
    <div class="form-group">
        <label for="customer_email">Customer Email:</label>
        <input type="email" id="customer_email" name="customer_email" required placeholder="customer@example.com">
    </div>

    <!-- Products Container -->
    <div id="products-container">
        <h3>Products</h3>
        <div class="products-row" id="product-row-1">
            <div class="form-group">
                <label for="product_id_1">Product ID:</label>
                <input type="text" id="product_id_1" name="product_id_1" required placeholder="e.g., P101">
            </div>
            <div class="form-group">
                <label for="quantity_1">Quantity:</label>
                <input type="number" id="quantity_1" name="quantity_1" min="1" required value="1">
            </div>
        </div>
    </div>

    <button type="button" class="btn btn-secondary" onclick="addProductRow()" style="margin: 20px 0;">
        + Add Another Product
    </button>

    <!-- Cash Paid -->s
    <div class="form-group" style="margin-top: 30px;">
        <label for="cash_paid">Cash Paid (₹):</label>
        <input type="number" id="cash_paid" name="cash_paid" min="0" required placeholder="Enter amount paid" step="0.01">
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary" style="margin-top: 20px; padding: 10px 30px; font-size: 16px;">
        Create Bill
    </button>
</form>

<!-- Loading and Error Messages -->
<div id="message-container"></div>

{% endblock %}

{% block scripts %}
<script src="/static/js/dynamic_form.js"></script>
<script>
document.getElementById('billing-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    try {
        // Collect form data
        const customerEmail = document.getElementById('customer_email').value;
        const cashPaid = parseFloat(document.getElementById('cash_paid').value);

        // Collect products
        const items = [];
        const productRows = document.querySelectorAll('.products-row');
        
        productRows.forEach(row => {
            const rowId = row.id.split('-')[2];
            const productId = document.getElementById(`product_id_${rowId}`).value.trim();
            const quantity = parseInt(document.getElementById(`quantity_${rowId}`).value);

            if (productId && quantity > 0) {
                items.push({
                    product_id: productId,
                    quantity: quantity
                });
            }
        });

        // Validate inputs
        if (items.length === 0) {
            showAlert('Please add at least one product', 'error');
            return;
        }

        if (!customerEmail) {
            showAlert('Please enter customer email', 'error');
            return;
        }

        if (!cashPaid || cashPaid <= 0) {
            showAlert('Please enter valid cash amount', 'error');
            return;
        }

        // Show loading message
        showAlert('Creating bill...', 'info');

        // Call API to create bill
        const response = await apiCall('/api/billing/create', 'POST', {
            customer_email: customerEmail,
            items: items,
            cash_paid: cashPaid
        });

        // Redirect to bill summary page
        window.location.href = `/billing/summary/${response.purchase_id}`;

    } catch (error) {
        showAlert(`Error creating bill: ${error.message}`, 'error');
    }
});
</script>
{% endblock %}
